[package]
name = "grok-models"
version = "1.2.0"
edition = "2024"
description = "TUI for configuring Grok Build and Codex to use custom models from alternate providers and gateways."
default-run = "grok-models"

[lib]
name = "grok_models"
path = "src/lib.rs"

[[bin]]
name = "grok-models"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", default-features = true }
once_cell = "1"
phf = { version = "0.14", features = ["macros"] }
# Used only to validate generated TOML, mirroring Python's tomllib check.
toml = "1"
home = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.2"
ratatui = "0.30"
crossterm = "0.29"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
